  {q1:{t:"彼が私の話を中断しないで聞いてくれるところが好きだ。",l:"B"},q2:{t:"彼からのプレゼントなら、いつでもいつまでも嬉しい。",l:"C"}},
  {q1:{t:"彼は私が疲れているとそれを察して、何をして手伝ったらいいかと尋ねてくれる。",l:"D"},q2:{t:"目的地がどこだろうと、とにかく彼と一緒に出かけるのが好き。",l:"B"}},
  {q1:{t:"彼と抱き合うのが大好き。",l:"E"},q2:{t:"彼のプレゼントに驚かされるのが大好きだ。",l:"C"}},
  {q1:{t:"彼の励ましの言葉が私に自信を与えてくれる。",l:"A"},q2:{t:"彼と映画を見るのが好き。",l:"B"}},
  {q1:{t:"彼からのプレゼントに勝る贈り物はない。",l:"C"},q2:{t:"彼が私に触らずにいられないことが嬉しい。",l:"E"}},
  {q1:{t:"彼が忙しいのに私を手伝ってくれる時、とてもありがたく思う。",l:"D"},q2:{t:"「感謝してる」と彼が言ってくれると、ものすごく気分がいい。",l:"A"}},
  {q1:{t:"しばらく離れていたあと、彼を抱きしめてキスするのが好き。",l:"E"},q2:{t:"私がいなくて寂しかったと彼に言われるのが好き。",l:"A"}}
];

let gender=null, questions=[], scores={A:0,B:0,C:0,D:0,E:0}, current=0, phase='gender';

function render(){
  const s=document.getElementById('screen');
  if(phase==='gender') renderGender(s);
  else if(phase==='quiz') renderQuiz(s);
  else renderResult(s);
}

function renderGender(s){
  s.innerHTML=`<div class="card">
    <div class="gender-intro">
      <span class="big-emoji">💝</span>
      <h2>愛の5つの言語 診断テスト</h2>
      <p>ゲイリー・チャップマン博士の原典をもとにした<br>30問の本格診断です。</p>
    </div>
    <div class="notice-box">📋 各組の設問を読んで、あなたの希望・要望をよりよく表現していると思うほうの文章を選んでください。なるべくリラックスした環境でテストし、あわてて終わらせることは避けてください。</div>
    <p class="gender-label">まず、あなたの性別を選んでください</p>
    <div class="gender-btns">
      <button class="gender-btn male" onclick="selectGender('male')"><span class="g-emoji">👨</span><span>男性</span></button>
      <button class="gender-btn female" onclick="selectGender('female')"><span class="g-emoji">👩</span><span>女性</span></button>
    </div>
  </div>`;
}

function renderQuiz(s){
  const q=questions[current];
  const pct=Math.round(current/questions.length*100);
  const backBtn=current>0?`<button class="btn-back" onclick="goBack()">← 前の問題に戻る</button>`:'';
  s.innerHTML=`<div class="card">
    <div class="progress-area">
      <div class="progress-top"><span class="progress-label">進捗</span><span class="progress-count">${current+1} / ${questions.length}</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-label">Q${current+1}</div>
    <div class="q-hint">どちらの文章があなたをよりよく表していますか？</div>
    <div class="options">
      <button class="option-btn" onclick="answer('q1')"><div class="option-circle">1</div><div class="option-text">${q.q1.t}</div></button>
      <button class="option-btn" onclick="answer('q2')"><div class="option-circle">2</div><div class="option-text">${q.q2.t}</div></button>
    </div>
    ${backBtn}
  </div>`;
}

function renderResult(s){
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const [tK,tS]=sorted[0],[sK,sS]=sorted[1];
  const top=LANGS[tK],sec=LANGS[sK],total=questions.length;
  const tips=getTips(tK);
  const bars=sorted.map(([k,v],i)=>{
    const l=LANGS[k];
    const pct=Math.round(v/total*100);
    const badge=i===0?'<span class="rank-badge">👑 1位</span>':i===1?'<span class="rank-badge second">2位</span>':'';
    return `<div><div class="bar-top"><div class="bar-name">${l.emoji} ${l.name}${badge}</div><div class="bar-score" style="color:${l.color}">${v}点</div></div><div class="bar-bg"><div class="bar-fill" id="bf_${k}" style="width:0%;background:${l.color}"></div></div></div>`;
  }).join('');
  s.innerHTML=`<div class="card">
    <div class="result-header">
      <span class="result-emoji">${top.emoji}</span>
      <div class="result-title">あなたのラブランゲージ</div>
      <div class="result-sub">30問 診断完了！💕</div>
    </div>
    <div class="result-card" style="background:linear-gradient(135deg,#FFF0F6,#F5E6FF);border-color:rgba(255,107,157,.2)">
      <div class="result-lang-name" style="color:${top.color}">${top.emoji} ${top.name} <span class="rank-badge">👑 1位</span></div>
      <div class="result-lang-desc">${top.desc}</div>
    </div>
    ${sS>0?`<div class="result-card" style="background:linear-gradient(135deg,#F0F8FF,#E8F0FF);border-color:rgba(116,192,252,.25)"><div class="result-lang-name" style="color:${sec.color}">${sec.emoji} ${sec.name} <span class="rank-badge second">2位</span></div><div class="result-lang-desc">${sec.desc}</div></div>`:''}
    <div style="margin-bottom:20px"><div class="tips-title">💡 あなたへのアドバイス</div>${tips.map(t=>`<div class="tip-item">${t}</div>`).join('')}</div>
    <div class="bars">${bars}</div>
    <button class="btn-primary" onclick="restart()">もう一度診断する 🔄</button>
    <button class="btn-secondary" onclick="shareResult('${tK}','${sK}')">結果をコピーして共有 📋</button>
  </div>`;
  setTimeout(()=>{sorted.forEach(([k,v])=>{const el=document.getElementById('bf_'+k);if(el)el.style.width=Math.round(v/total*100)+'%';});},80);
}

let answerHistory=[]; // 各回答で選んだlangを記録

function selectGender(g){
  gender=g; questions=g==='male'?Q_MALE:Q_FEMALE;
  scores={A:0,B:0,C:0,D:0,E:0}; current=0; answerHistory=[]; phase='quiz'; render();
}
function answer(choice){
  const lang=questions[current][choice].l;
  answerHistory.push(lang);
  scores[lang]++;
  current++;
  if(current>=questions.length){phase='result';render();launchConfetti();}
  else render();
}
function goBack(){
  if(current===0) return;
  current--;
  const lang=answerHistory.pop();
  scores[lang]--;
  render();
}
function restart(){phase='gender';gender=null;answerHistory=[];render();}
function getTips(k){
  return {
    A:["言葉で気持ちを伝えてもらうことが大切。パートナーに「声に出して言ってほしい」と直接伝えましょう。","褒め言葉・励ましの言葉が心の栄養。批判的な言葉は特に傷つきやすい傾向があります。","日記に感謝の言葉を書くなど、自分自身でも言葉の力を意識してみて。"],
    B:["「一緒にいる時間」の質を重視します。スマホなしで向き合う時間を意識して作りましょう。","共通の体験や趣味を増やすことで満足感が高まります。","相手が話す時にしっかり聴くことが、最大の愛情表現になります。"],
    C:["形ある物に気持ちを感じます。高額なものより「あなたのことを考えた」という思いが大切。","誕生日・記念日などを覚えてもらえることが深く刺さります。","小さなお土産や「あなたに似合いそう」の一言が大きな喜びになります。"],
    D:["「やってくれること」が愛の言語。「何か手伝おうか？」の一言が心に響きます。","疲れた時に代わりにやってくれることが、言葉以上の愛情表現になります。","頼まなくても気づいて動いてくれることに特に感動します。"],
    E:["スキンシップを通じて安心感・つながりを感じます。ハグや手をつなぐことを日常にしましょう。","遠距離の場合は、帰省時のスキンシップをいつも以上に意識することが大切です。","相手のペースを尊重しながら、二人にとって心地よい接触の形を探してみて。"]
  }[k];
}
function shareResult(tK,sK){
  const top=LANGS[tK],sec=LANGS[sK],gL=gender==='male'?'男性':'女性';
  const text=`💕 ラブランゲージ診断（${gL}）結果\n\n🥇 ${top.emoji} ${top.name}\n🥈 ${sec.emoji} ${sec.name}\n\n#ラブランゲージ診断 #愛の5つの言語`;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('クリップボードにコピーしました！'));}
  else{prompt('コピーしてシェアしてね！',text);}
}
function launchConfetti(){
  const canvas=document.getElementById('confetti');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=['#FF6B9D','#FFD93D','#6BCB77','#74C0FC','#C77DFF','#FF8E72'];
  const pts=Array.from({length:90},()=>({x:Math.random()*canvas.width,y:-10,r:Math.random()*7+3,color:colors[Math.floor(Math.random()*colors.length)],vy:Math.random()*3+2,vx:(Math.random()-.5)*2,angle:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.2}));
  let f=0;
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();p.y+=p.vy;p.x+=p.vx;p.angle+=p.spin;});f++;if(f<130)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  draw();
}
render();
</script>
